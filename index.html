<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>eFootball Arena</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet"><meta name="color-scheme" content="dark">
<style>
:root{--bg:#070b16;--pn:rgba(255,255,255,.05);--bd:rgba(255,255,255,.12);--tx:#f2f5fb;--mu:#8e9ab3;--bl:#2b6cff;--gr:#22c55e;--am:#f5a524;--rd:#ef4444;--go:#f6c453;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,Segoe UI,Arial,sans-serif;min-height:100vh}
body{background:radial-gradient(ellipse at 15% 0,#1b3a8a55,transparent 50%),radial-gradient(ellipse at 85% 0,#1b3a8a55,transparent 50%),var(--bg)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.b{background:var(--bl);border:0;border-radius:8px;padding:9px 16px;font-weight:700;letter-spacing:.03em}.b:hover{filter:brightness(1.15)}.b.g{background:transparent;border:1px solid var(--bd)}.b.r{background:var(--rd)}.b:disabled{opacity:.4}
:focus-visible{outline:2px solid #8fb3ff;outline-offset:2px}
nav{display:flex;gap:6px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap;background:#0a1020cc;position:sticky;top:0;z-index:5}
nav .br{font-weight:800;margin-right:auto}nav button{background:none;border:0;padding:7px 10px;border-radius:6px;color:var(--mu)}nav button.on{color:#fff;background:var(--pn)}
main{max-width:1100px;margin:0 auto;padding:18px 14px}h1{margin:.2em 0}h2{font-size:18px;margin:18px 0 8px}
.pn{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:14px;backdrop-filter:blur(8px)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.st b{display:block;font-size:24px}.st span{color:var(--mu);font-size:12px}
.tw{overflow-x:auto;max-width:100%}table{border-collapse:collapse;width:100%;min-width:560px}th,td{padding:8px 9px;text-align:center;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-size:12px}td:nth-child(2){text-align:left}
tr.q td{background:#22c55e1c}tr.q td:first-child{box-shadow:inset 3px 0 var(--gr)}
.sc{display:inline-flex;gap:3px;align-items:center}.sc button{width:26px;height:26px;border-radius:6px;border:1px solid var(--bd);background:var(--pn)}.sc input{width:46px;text-align:center;background:#0d1426;border:1px solid var(--bd);border-radius:6px;padding:4px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}.ok{color:var(--gr)}.wa{color:var(--am)}.er{color:var(--rd)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:linear-gradient(#070b16cc,#070b16ee),radial-gradient(circle at 20% 10%,#fff6 0,transparent 8%),radial-gradient(circle at 50% 8%,#fff6 0,transparent 8%),radial-gradient(circle at 80% 10%,#fff6 0,transparent 8%),linear-gradient(#0b1b3d,#0a3a1f)}
.hero h1{font-size:clamp(32px,7vw,64px)}.hero p{color:var(--mu)}
.ko{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px}.col{display:flex;flex-direction:column;justify-content:space-around;gap:12px;min-width:230px}.col h3{margin:0;text-align:center;color:var(--mu);font-size:13px}
.m{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:8px}.tm{display:flex;justify-content:space-between;padding:5px 6px;border-radius:6px}.tm.w{background:#f6c45326;color:var(--go);font-weight:700}
.ov{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#3a2e0a,#03050b 70%);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;overflow:hidden}
.ov .tr{font-size:90px;animation:up 1.2s both}.ov h1{font-size:clamp(34px,9vw,80px);color:var(--go);animation:up 1.2s .8s both}.ov .sub{animation:up 1s 1.6s both}
.cf{position:absolute;top:-20px;width:8px;height:14px;background:var(--go);animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}@keyframes up{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:none}}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111a33;border:1px solid var(--bd);padding:10px 16px;border-radius:10px;z-index:30;max-width:90vw}
input.t,select.t{background:#0d1426;border:1px solid var(--bd);border-radius:6px;padding:7px;width:100%}label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
.sw button{padding:0 6px;height:22px;border:1px solid var(--bd);background:var(--pn);border-radius:4px;margin:0 1px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.col h3{margin:0 22px 6px;padding:8px;text-align:center;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:8px}
.sl{flex:1;display:flex;align-items:center;position:relative;padding:8px 22px}.sl>.m{width:100%}
.sl.u::after,.sl.d::after{content:'';position:absolute;right:0;width:22px;border:0 solid #4f7cffaa}
.sl.u::after{top:50%;bottom:0;border-top-width:2px;border-right-width:2px}.sl.d::after{top:0;bottom:50%;border-bottom-width:2px;border-right-width:2px}
.sl.in::before{content:'';position:absolute;left:0;top:50%;width:22px;border-top:2px solid #4f7cffaa}
.sp,.th{flex:none;height:215px}.th .sl{flex:none;padding-top:0}
.m{padding:6px;background:linear-gradient(160deg,#ffffff14,#ffffff06);border-color:#4f7cff55;box-shadow:0 8px 22px #0007}
.mt{display:block;color:var(--mu);font-size:11px;padding:2px 8px 4px;letter-spacing:.05em;text-transform:uppercase}
.tm{align-items:center;gap:8px;padding:6px 8px}.tm+.tm{border-top:1px solid var(--bd)}.nn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac{display:flex;gap:6px;padding:6px 4px 2px}.ac select{flex:1;min-width:0;padding:5px;font-size:12px}.ac .b{padding:5px 12px;font-size:12px;margin-left:auto}
.m .sc button{width:22px;height:22px;padding:0}.m .sc input{width:36px;padding:3px}
body{font-family:'Outfit',system-ui,Segoe UI,Arial,sans-serif}h1,h2,.br,.col h3,.ov h1,.yr{font-family:'Cinzel',Georgia,serif}
h1{font-size:30px;letter-spacing:.02em}h2{font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:#cfd8ee;display:flex;align-items:center;gap:10px;margin:24px 0 10px}h2::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--bd),transparent)}
nav{background:rgba(7,11,22,.72);backdrop-filter:blur(14px);border-bottom:1px solid rgba(246,196,83,.2)}
.br{background:linear-gradient(90deg,#f6c453,#fff1c1);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:19px;font-weight:800;letter-spacing:.04em}
nav button{transition:.2s}nav button:hover{color:#fff}nav button.on{background:linear-gradient(180deg,#2b6cff33,#2b6cff0d);box-shadow:inset 0 -2px #2b6cff;color:#fff}
.pn{background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.06);border-radius:16px}
.b{background:linear-gradient(180deg,#3d7bff,#2557d6);box-shadow:0 4px 16px #2b6cff55;transition:.2s}.b:hover{transform:translateY(-1px)}.b.g{background:rgba(255,255,255,.05);box-shadow:none}.b.r{background:linear-gradient(180deg,#f05252,#c93030);box-shadow:none}
.st{position:relative;overflow:hidden;padding-top:28px}.st b{font-size:30px;background:linear-gradient(180deg,#fff,#9fb6ff);-webkit-background-clip:text;background-clip:text;color:transparent}.st i{position:absolute;right:12px;top:8px;line-height:1;font-style:normal;font-size:22px;opacity:.5}
th{text-transform:uppercase;letter-spacing:.08em}tr:hover td{background:rgba(255,255,255,.03)}tr.q:hover td{background:#22c55e26}
main>*{animation:fi .5s both}@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.hist{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:22px}.hc{text-align:center;position:relative;border-color:rgba(246,196,83,.35);background:linear-gradient(160deg,rgba(246,196,83,.15),rgba(255,255,255,.02))}.hc .tro{font-size:36px;filter:drop-shadow(0 0 12px #f6c45388)}.hc .cn{display:block;font-size:19px;color:var(--go);margin:4px 0;font-family:'Cinzel',Georgia,serif}.yr{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}.hc small{color:var(--mu)}.hc.em{opacity:.5;border-style:dashed}.smp{position:absolute;top:8px;right:10px;font-size:10px;color:var(--mu);font-style:normal;border:1px solid var(--bd);border-radius:99px;padding:1px 7px}
.logo{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;font-size:50px;background:radial-gradient(circle,#2b6cff55,#0000 70%);border:2px solid #f6c45399;box-shadow:0 0 44px #2b6cff88,inset 0 0 20px #f6c45333;margin-bottom:10px}
.gt{background:linear-gradient(180deg,#fff,#f6c453);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.05em;margin:.1em 0}
.hero .tag2{letter-spacing:.26em;text-transform:uppercase;font-size:13px;color:#aebbd8}.hero .ttl{color:#c9d4ee}.hero .b{box-shadow:0 0 34px #2b6cffaa;margin:6px}
h1,.br,.ov h1,.gt{font-family:'Outfit',system-ui,Arial,sans-serif;font-weight:800}.hc .cn{font-family:'Outfit',system-ui,sans-serif}
.gl{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:16px 12px}.gn{font-size:18px;font-weight:700}.gp{display:flex;flex-direction:column;align-items:center;gap:4px}.gp .tag{font-size:12px;padding:3px 12px;letter-spacing:.08em;font-weight:700}.gp small{color:var(--mu)}

/* ===== Welcome: player cutouts ===== */
.hero{position:relative;overflow:hidden;min-height:100vh;min-height:100svh;isolation:isolate}
.hero::before{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 60% 55% at 50% 46%,rgba(7,11,22,.0),rgba(7,11,22,.55) 100%),radial-gradient(ellipse 45% 60% at 50% 40%,rgba(43,108,255,.16),transparent 70%)}
.hero::after{content:'';position:absolute;left:0;right:0;bottom:0;height:30%;z-index:2;pointer-events:none;background:linear-gradient(to top,#070b16 0%,rgba(7,11,22,.7) 30%,transparent 100%)}
.hero>*:not(.pl){position:relative;z-index:3}
.hero>#mb{position:fixed;z-index:6}
.hero .hint{transition:opacity .4s}
.pl{position:absolute;bottom:0;z-index:1;pointer-events:none;will-change:transform,opacity}
.pl img{display:block;height:auto;user-select:none;-webkit-user-drag:none;position:relative;z-index:1;
  filter:drop-shadow(0 0 28px rgba(246,196,83,.22)) drop-shadow(0 26px 38px rgba(0,0,0,.65));
  animation:plFloat 8s ease-in-out 1.8s infinite}
.plg{position:absolute;left:50%;bottom:6%;width:150%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;z-index:0;filter:blur(30px);opacity:.9}
.pl-l .plg{background:radial-gradient(circle,rgba(246,196,83,.26),rgba(246,196,83,.06) 45%,transparent 68%)}
.pl-r .plg{background:radial-gradient(circle,rgba(43,108,255,.34),rgba(43,108,255,.08) 45%,transparent 68%)}
.pl-l{left:0;transform-origin:0 100%;animation:plInL 1.6s cubic-bezier(.16,1,.3,1) .2s backwards}
.pl-r{right:0;transform-origin:100% 100%;animation:plInR 1.6s cubic-bezier(.16,1,.3,1) .45s backwards}
.pl-l img{width:min(29vw,60vh);margin-left:1.5vw}
.pl-r img{width:min(38vw,82vh);margin-right:-1vw}
.pl-r img{animation-delay:2.2s;animation-direction:alternate-reverse}
@keyframes plInL{from{opacity:0;transform:translateX(-115%) scale(.94);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes plInR{from{opacity:0;transform:translateX(115%) scale(.94);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes plOutL{from{opacity:1;transform:none;filter:blur(0)}to{opacity:0;transform:translateX(-120%) scale(.94);filter:blur(10px)}}

</style></head><body><div id="app"></div><div id="toast" hidden></div>
<script>
const K='efa1';
const SEED=()=>[];
const def=()=>({v:1,title:'eFootball Arena Championship',sub:'Your tournament. Your matches. Your champion.',players:Array.from({length:16},(_,i)=>({id:'p'+i,name:'Player '+(i+1),g:i%4})),ng:4,q:2,third:true,sc:{},man:{},ko:{res:{},draw:null},ann:false,hist:SEED(),tid:'t'+Date.now()});
let S;try{S=JSON.parse(localStorage.getItem(K));if(!S||S.v!==1||!Array.isArray(S.players))throw 0}catch(e){S=def()}
if(!Array.isArray(S.hist))S.hist=SEED();S.hist=S.hist.filter(x=>!x.s);if(!S.tid)S.tid='t'+Date.now();
let ED=false,ME=null,PACT='',INFL=false,NS=null;try{sessionStorage.removeItem('ed');sessionStorage.removeItem('pw')}catch(e){}
let V='welcome',MG='all',PD={},D=null,SHOW=false,LERR='';
// ---------- realtime sync (Vercel API + Supabase) ----------
const API='/api/state';let SREV=0,PUSHT=null;
async function api(p,m,b){const r=await fetch(p,{method:m||'GET',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'arena'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));return{r,j}}
const NOC={r:{},j:{error:'No connection to server.'}};
function leaveEd(m){ED=false;ME=null;D=null;if(/^(set|act|adm|pw)$/.test(V))V='dash';R();toast(m,'er')}
function push(){clearTimeout(PUSHT);PUSHT=setTimeout(async()=>{if(INFL){push();return}PUSHT=null;if(!ED||ME.mustChangePassword)return;INFL=true;const a=PACT;PACT='';try{const{r,j}=await api(API,'POST',{data:S,baseRev:SREV,action:a||undefined});if(r.ok){SREV=j.rev}else if(r.status==409){if(j.data){S=j.data;if(!Array.isArray(S.hist))S.hist=[];SREV=j.rev;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}D=V=='set'?JSON.parse(JSON.stringify(S)):null;PD={};R();toast('Another admin changed this, latest version loaded','er')}else{SREV=j.rev||0;PACT=PACT||a;push()}}else if(r.status==401){leaveEd('Session expired. Please log in again.')}else if(r.status==403){if(j.mustChangePassword){ME.mustChangePassword=true;go('pw')}else leaveEd('You no longer have edit access.')}else{PACT=PACT||a;toast('Sync failed. Will retry on next change.','er')}}catch(e){PACT=PACT||a;toast('Offline: change not synced yet','er')}finally{INFL=false}},250)}
async function pull(first){try{const r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();if(!j.data)return 'empty';if(j.rev===SREV)return;
const d=j.data;if(d.v!==1||!Array.isArray(d.players))return;
if(!first){const a=document.activeElement;if((ED&&(V=='set'||PUSHT||INFL))||V=='welcome'||document.querySelector('[role=dialog]')||(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)))return}
SREV=j.rev;if(JSON.stringify(d)!==JSON.stringify(S)){S=d;if(!Array.isArray(S.hist))S.hist=[];S.hist=S.hist.filter(x=>!x.s);if(!S.tid)S.tid='t'+Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(!first)R()}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
const save=()=>{syncH();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}push()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const nm=id=>id?esc((S.players.find(p=>p.id==id)||{}).name):'TBD';
const GN=g=>String.fromCharCode(65+g);
const toast=(m,c)=>{const t=document.getElementById('toast');t.textContent=m;t.className=c||'';t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3500)};
function go(v){if(AC&&AC.state!='running')AC.resume();if(/^(set|act|adm|pw)$/.test(v)&&!ED)v='login';if(v=='adm'&&ME.role!='owner')v='dash';if(v!=V)LERR='';V=v;if(v=='set'&&!D)D=JSON.parse(JSON.stringify(S));if(v=='act')loadAud(true);if(v=='adm')loadAdm();scrollTo(0,0);R()}
// ---------- logic ----------
function fx(){const o=[];for(let g=0;g<S.ng;g++){let a=S.players.filter(p=>p.g==g).map(p=>p.id);if(a.length%2)a.push(null);const n=a.length;for(let r=0;r<n-1;r++){for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];if(x&&y)o.push({id:`G${g}R${r+1}_${x}_${y}`,g,r:r+1,a:x,b:y})}a.splice(1,0,a.pop())}}return o}
function st(g){const m={};S.players.filter(p=>p.g==g).forEach(p=>m[p.id]={id:p.id,P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0});
fx().filter(f=>f.g==g).forEach(f=>{const s=S.sc[f.id];if(!s)return;const[x,y]=s,A=m[f.a],B=m[f.b];A.P++;B.P++;A.GF+=x;A.GA+=y;B.GF+=y;B.GA+=x;if(x>y){A.W++;B.L++;A.Pts+=3}else if(x<y){B.W++;A.L++;B.Pts+=3}else{A.D++;B.D++;A.Pts++;B.Pts++}});
const r=Object.values(m);r.forEach(o=>{o.GD=o.GF-o.GA;o.k=[o.Pts,o.GD,o.GF,o.GA].join()});
r.sort((a,b)=>b.Pts-a.Pts||b.GD-a.GD||b.GF-a.GF||a.GA-b.GA||(S.man[a.id]??99)-(S.man[b.id]??99));
r.forEach(o=>{const b=r.filter(z=>z.k==o.k);o.blk=o.P>0&&b.length>1?b:null});return r}
function tieB(g){const r=st(g),q=S.q,a=r[q-1],b=r[q];return !!(a&&b&&a.P>0&&a.k==b.k&&!(S.lock&&S.lock[g]&&S.man[a.id]!=null&&S.man[a.id]!=S.man[b.id]))}
const done=()=>{const f=fx();return!!f.length&&f.every(x=>S.sc[x.id])};
const ties=()=>[...Array(S.ng).keys()].filter(tieB);
const ready=()=>done()&&!ties().length;
function swap(id,d){const g=S.players.find(p=>p.id==id).g,r=st(g),i=r.findIndex(o=>o.id==id),j=i+d;
if(S.lock&&S.lock[g]){toast('Ranking is locked. Unlock to swap.','er');return}if(!ED||!r[j]||r[j].k!=r[i].k){toast('Swap only allowed between players tied on Pts, GD, GF and GA.','er');return}
const blk=r.filter(o=>o.k==r[i].k).map(o=>o.id),a=blk.indexOf(id),b=blk.indexOf(r[j].id);[blk[a],blk[b]]=[blk[b],blk[a]];act(()=>blk.forEach((x,n)=>S.man[x]=n),'Manual ranking updated')}
const N=()=>S.ng*S.q,RN=()=>Math.log2(N());
function draw(){const W=[],Ru=[];let all=[];for(let g=0;g<S.ng;g++){const r=st(g).slice(0,S.q);W.push(r[0].id);if(S.q==2)Ru.push(r[1].id);r.forEach((o,i)=>all.push({id:o.id,i,Pts:o.Pts,GD:o.GD,GF:o.GF}))}
const P=[];if(S.q==2&&S.ng>1){for(let i=0;i<S.ng;i++)P.push([W[i],Ru[(i+1)%S.ng]]);if(S.ng%2){}}
else{all.sort((a,b)=>a.i-b.i||b.Pts-a.Pts||b.GD-a.GD||b.GF-a.GF);for(let i=0;i<all.length/2;i++)P.push([all[i].id,all[all.length-1-i].id])}
// order so same-group winners meet late
if(S.q==2&&S.ng==4){return[P[0],P[1],P[2],P[3]]}return P}
function ensureDraw(){if(ready()&&!S.ko.draw&&Number.isInteger(RN())&&N()>=2){S.ko.draw=draw();save()}}
function parts(k,i){return k==0?(S.ko.draw||[])[i]||[null,null]:[W(k-1,2*i),W(k-1,2*i+1)]}
const W=(k,i)=>(S.ko.res[k+'-'+i]||{}).w||null;
const lose=(k,i)=>{const w=W(k,i);return w?parts(k,i).find(x=>x&&x!=w)||null:null};
const tparts=()=>RN()>=2?[lose(RN()-2,0),lose(RN()-2,1)]:[null,null];
const champ=()=>W(RN()-1,0);
const rname=k=>{const c=N()/2**(k+1);return c==1?'Final':c==2?'Semi-finals':c==4?'Quarter-finals':'Round of '+c*2};
async function koSave(key){let a,b,k,i;if(key=='t')[a,b]=tparts();else{[k,i]=key.split('-').map(Number);[a,b]=parts(k,i)}
const sa=document.getElementById(key+'a').value,sb=document.getElementById(key+'b').value;
if(!/^\d+$/.test(sa)||!/^\d+$/.test(sb)){toast('Enter valid non-negative scores.','er');return}
const x=+sa,y=+sb;let w=x>y?a:y>x?b:document.getElementById(key+'w').value;
if(!w){toast('Match tied. A winner must be confirmed before the bracket can advance.','er');return}
const old=S.ko.res[key];if(old&&old.w!=w&&key!='t'){const dep=Object.keys(S.ko.res).some(z=>z=='t'||+z.split('-')[0]>k);if(dep){if(!await ask('Changing this winner will clear dependent later results. Continue?'))return;Object.keys(S.ko.res).forEach(z=>{if(z=='t'||+z.split('-')[0]>k)delete S.ko.res[z]})}}
else if(old&&!await ask('Overwrite the existing result?'))return;
S.ko.res[key]={s:[x,y],w,m:x==y?'Extra time / penalties':'Regulation'};S.ann=old?S.ann:false;save();toast('Result saved');R()}
// ---------- views ----------
const nav=()=>`<nav><span class=br>⚽ eFootball Arena</span>${[['dash','Dashboard'],['matches','Matches'],['stand','Standings'],['ko','Knockout'],...(ED?[['set','Settings'],['act','Activity'],...(ME.role=='owner'?[['adm','Admins']]:[])]:[])].filter(()=>!(ED&&ME.mustChangePassword)).map(([v,l])=>`<button class="${V==v?'on':''}" onclick="go('${v}')">${l}</button>`).join('')}<button class=mbt onclick="musicTog()" aria-label="Toggle music">${mut?'🔇':'🔊'}</button>${ED?`<span class=tag>${esc(ME.username)} · ${esc(ME.role)}</span>${ME.mustChangePassword?'':`<button class="${V=='pw'?'on':''}" onclick="go('pw')">Change password</button>`}<button onclick="logout()">Logout</button>`:`<button class="${V=='login'?'on':''}" onclick="go('login')">Editor Login</button>`}</nav>`;
const welcome=()=>`<div class=hero id=hero><div class="pl pl-l" aria-hidden=true><div class=plg></div><img src="${PL_A}" alt="" draggable=false></div><div class="pl pl-r" aria-hidden=true><div class=plg></div><img src="${PL_B}" alt="" draggable=false></div><div class=logo>⚽</div><h1 class=gt>eFootball Arena</h1><p class=tag2>${esc(S.sub)}</p><p class=ttl>${esc(S.title)}</p><button class="b go" onclick="leave()" style="font-size:17px;padding:14px 26px">Go to eFootball Arena →</button><p id=mh class=hint>🔊 Tap anywhere to start the stadium music</p><button id=mb class="b g mbt" aria-label="Toggle music" onclick="musicTog()" style="position:fixed;top:14px;right:14px;padding:8px 12px">🔊</button></div>`;
function login(){if(NS===null){NS=false;api('/api/setup').then(({r,j})=>{if(r.ok&&j.needsSetup){NS=true;if(V=='login')R()}}).catch(()=>{})}const pt=SHOW?'text':'password';
return`<div style="max-width:380px;margin:40px auto" class=pn><div style="font-size:36px;text-align:center">🔒</div><h1 style="text-align:center;font-size:24px">${NS?'Create owner account':'Editor Login'}</h1><form onsubmit="return doLogin(event)">${NS?`<label for=st>Setup token</label><input class=t id=st type=password autocomplete=off>`:''}<label for=un>Username</label><input class=t id=un autocomplete=username autocapitalize=none spellcheck=false><label for=pw>Password</label><div style="display:flex;gap:6px"><input class=t id=pw type="${pt}" autocomplete=${NS?'new-password':'current-password'}><button type=button class="b g" onclick="SHOW=!SHOW;keepPw()">${SHOW?'Hide':'Show'}</button></div>${NS?`<label for=pw2>Confirm password</label><input class=t id=pw2 type="${pt}" autocomplete=new-password>`:''}<p class=er role=alert>${esc(LERR)}</p><button class=b style="width:100%">${NS?'CREATE OWNER ACCOUNT':'UNLOCK ARENA'}</button></form>${NS?'':'<p style="color:var(--mu);font-size:13px;text-align:center">Forgot your password? Ask the tournament owner to reset it.</p>'}<br><button class="b g" style="width:100%" onclick="go('dash')">Back to Dashboard</button></div>`}
function keepPw(){const v=[...document.querySelectorAll('main input')].map(e=>e.value);R();document.querySelectorAll('main input').forEach((e,i)=>e.value=v[i]??'')}
let busy=false;function doLogin(e){e.preventDefault();if(busy)return false;const $=id=>(document.getElementById(id)||{}).value||'',u=$('un').trim().toLowerCase(),p=$('pw'),su=NS;
if(su&&p!==$('pw2')){LERR='Passwords do not match.';keepPw();return false}busy=true;
api(su?'/api/setup':'/api/login','POST',su?{setupToken:$('st'),username:u,password:p}:{username:u,password:p}).then(async({r,j})=>{if(r.ok){ED=true;ME=j;LERR='';NS=null;const x=await pull(true);if(x==='empty'&&!ME.mustChangePassword)push();toast(su?'Owner account created':'Editor mode active');go(ME.mustChangePassword?'pw':'dash')}else if(su&&r.status==403&&j.error!='Invalid setup token'){NS=null;LERR=j.error||'';R()}else{LERR=j.error||(r.status>=500?'Server error. Check Vercel setup.':'Login failed.');keepPw()}}).catch(()=>{LERR='No connection to server.';keepPw()}).finally(()=>{busy=false});return false}
function logout(){api('/api/logout','POST').catch(()=>{});ED=false;ME=null;D=null;go('dash')}
function pwv(){const F=ME.mustChangePassword;return`<div style="max-width:380px;margin:40px auto" class=pn><div style="font-size:36px;text-align:center">🔑</div><h1 style="text-align:center;font-size:24px">${F?'Set a new password':'Change password'}</h1>${F?'<p style="color:var(--mu)">You must set a new password before continuing.</p>':''}<form onsubmit="return doPw(event)"><label for=cp>${F?'Temporary password':'Current password'}</label><input class=t id=cp type=password autocomplete=current-password><label for=np>New password (at least 8 characters)</label><input class=t id=np type=password autocomplete=new-password><label for=np2>Confirm new password</label><input class=t id=np2 type=password autocomplete=new-password><p class=er role=alert>${esc(LERR)}</p><button class=b style="width:100%">SAVE PASSWORD</button></form></div>`}
async function doPw(e){e.preventDefault();const $=id=>document.getElementById(id).value,n=$('np');if(n.length<8){LERR='New password must be at least 8 characters.';keepPw();return}if(n!==$('np2')){LERR='Passwords do not match.';keepPw();return}
const{r,j}=await api('/api/password','POST',{currentPassword:$('cp'),newPassword:n}).catch(()=>NOC);if(r.ok){ME=j;LERR='';toast('Password changed');go('dash')}else if(r.status==401)leaveEd('Session expired. Please log in again.');else{LERR=j.error||'Could not change password.';keepPw()}}
// ---------- admin pages: activity, admins, restore ----------
let AUD={rows:[],next:null,u:'',a:''},ADM={list:[],snaps:[]};
const ACTS=['state_update','state_init','reset','reset_stats','new_season','import_backup','rollback','login','logout','password_changed','owner_created','admin_created','admin_deactivated','admin_reactivated','admin_password_reset'];
const fd=t=>t?new Date(t).toLocaleString():'—',sb='style="padding:4px 10px;font-size:12px"';
function apiErr(r,j){if(r.status==401)return leaveEd('Session expired. Please log in again.');toast(j.error||'Request failed.','er')}
async function loadAud(fresh){if(fresh){AUD.rows=[];AUD.next=null}const q=new URLSearchParams({limit:50});if(AUD.u)q.set('username',AUD.u);if(AUD.a)q.set('action',AUD.a);if(!fresh&&AUD.next)q.set('before',AUD.next);
const{r,j}=await api('/api/audit?'+q).catch(()=>NOC);if(!r.ok)return apiErr(r,j);AUD.rows=AUD.rows.concat(j.rows);AUD.next=j.next;if(V=='act')R()}
function actv(){return`<h1>Activity</h1><div class=tabs><input class=t style="max-width:200px" placeholder="Filter by admin" aria-label="Filter by admin" value="${esc(AUD.u)}" onchange="AUD.u=this.value.trim().toLowerCase();loadAud(true)"><select class=t style="max-width:220px" aria-label="Filter by action" onchange="AUD.a=this.value;loadAud(true)"><option value="">All actions</option>${ACTS.map(a=>`<option ${AUD.a==a?'selected':''}>${a}</option>`).join('')}</select></div>
<div class="pn tw"><table><tr><th>Time</th><th>Admin</th><th>Action</th><th>Summary</th></tr>${AUD.rows.map(x=>`<tr><td style="white-space:nowrap">${esc(fd(x.at))}</td><td>${esc(x.actor_username||'—')}</td><td><span class=tag>${esc(x.action)}</span></td><td style="text-align:left">${esc(x.summary)}</td></tr>`).join('')||'<tr><td colspan=4>No activity yet</td></tr>'}</table></div>${AUD.next?'<p><button class="b g" onclick="loadAud()">Load more</button></p>':''}`}
async function loadAdm(){const[a,s]=await Promise.all([api('/api/admins'),api('/api/snapshots')]).catch(()=>[NOC,NOC]);if(!a.r.ok)return apiErr(a.r,a.j);ADM.list=a.j.admins;if(s.r.ok)ADM.snaps=s.j.snapshots;if(V=='adm')R()}
function admv(){return`<h1>Admins</h1><div class="pn tw"><table><tr><th>Username</th><th>Role</th><th>Status</th><th>Created</th><th>Last login</th><th>Actions</th></tr>${ADM.list.map((x,i)=>`<tr><td>${esc(x.username)}</td><td>${esc(x.role)}</td><td>${x.active?'<span class="tag ok">Active</span>':'<span class="tag er">Deactivated</span>'}${x.mustChangePassword?' <span class="tag wa">Must change password</span>':''}</td><td>${esc(fd(x.createdAt))}${x.createdBy?' by '+esc(x.createdBy):''}</td><td>${esc(fd(x.lastLoginAt))}</td><td style="white-space:nowrap">${x.role=='owner'?'—':`<button class="b g" ${sb} onclick="admAct(${i},${!x.active})">${x.active?'Deactivate':'Reactivate'}</button> <input class=t id="rp${i}" type=password autocomplete=new-password placeholder="New temporary password" aria-label="New temporary password" style="width:180px;padding:4px"> <button class="b g" ${sb} onclick="admReset(${i})">Reset password</button>`}</td></tr>`).join('')||'<tr><td colspan=6>Loading…</td></tr>'}</table></div>
<h2>Add admin</h2><div class=pn><form onsubmit="return admAdd(event)"><div class=grid><div><label for=nu>Username</label><input class=t id=nu autocomplete=off autocapitalize=none spellcheck=false placeholder="3–20 characters: a-z, 0-9, _"></div><div><label for=tp>Temporary password</label><input class=t id=tp type=password autocomplete=new-password placeholder="At least 8 characters"></div></div><p style="color:var(--mu);font-size:13px">Share the temporary password privately. They must set a new password on first login.</p><button class=b>Add admin</button></form></div>
<h2>Restore</h2><div class="pn tw"><table><tr><th>#</th><th>Saved</th><th>Changed by</th><th>Reason</th><th></th></tr>${ADM.snaps.map((x,i)=>`<tr><td>${esc(x.id)}</td><td>${esc(fd(x.at))}</td><td>${esc(x.actor_username||'—')}</td><td style="text-align:left">${esc(x.reason)}</td><td><button class="b r" ${sb} onclick="restore(${i})">Restore</button></td></tr>`).join('')||'<tr><td colspan=5>No snapshots yet</td></tr>'}</table></div><p style="color:var(--mu);font-size:13px">Each snapshot is the state just before a change. Restoring saves the current state as a snapshot first.</p>`}
async function admAdd(e){e.preventDefault();const u=document.getElementById('nu').value.trim().toLowerCase(),p=document.getElementById('tp').value;
const{r,j}=await api('/api/admins','POST',{username:u,password:p}).catch(()=>NOC);if(r.ok){toast('Admin '+u+' created');loadAdm()}else apiErr(r,j)}
async function admAct(i,on){const x=ADM.list[i];if(!x||!await ask((on?'Reactivate ':'Deactivate ')+x.username+'?'+(on?'':' They will be logged out immediately.')))return;
const{r,j}=await api('/api/admins','PATCH',{id:x.id,active:on}).catch(()=>NOC);if(r.ok){toast(x.username+(on?' reactivated':' deactivated'));loadAdm()}else apiErr(r,j)}
async function admReset(i){const x=ADM.list[i],p=document.getElementById('rp'+i).value;if(p.length<8){toast('Temporary password must be at least 8 characters.','er');return}
if(!await ask('Reset the password for '+x.username+'? They will be logged out and must set a new password on next login.'))return;
const{r,j}=await api('/api/admins','POST',{id:x.id,newPassword:p,action:'reset_password'}).catch(()=>NOC);if(r.ok){toast('Password reset for '+x.username);loadAdm()}else apiErr(r,j)}

function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g);g.connect(MG_);o.start(t);o.stop(t+.35)}
function sched(){if(!AC)return;while(nt<AC.currentTime+.4){const s=step%16,bar=Math.floor(step/16),ch=CH[bar%4],t=nt;
if(s==0){ch.p.forEach(f=>pad(f,t,SP*16));tone(ch.p[2]*4,t,SP*7,'sine',.07);if(bar>0&&bar%4==0)nz(t,1.4,'highpass',5000,.22,BUS)}
if(s%2==0){tone(ch.b*2,t,SP*1.8,'triangle',.3);tone(ch.p[[0,1,2,1,2,1,2,1][s/2]]*2,t,SP*1.6,'triangle',.11)}
if(bar>=2&&s%4==0)kick(t);if(bar>=2&&(s==4||s==12))nz(t,.18,'bandpass',1500,.5,BUS);if(bar>=1&&s%4==2)nz(t,.05,'highpass',7000,.16,MG_);
nt+=SP;step++}}
function musicStart(){if(mus)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){AC=null;return}
mus=true;t0=AC.currentTime;MG_=AC.createGain();MG_.gain.setValueAtTime(0,AC.currentTime);MG_.gain.linearRampToValueAtTime(mut?0:.55,AC.currentTime+2.5);MG_.connect(AC.destination);
BUS=AC.createGain();const dl=AC.createDelay(),fb=AC.createGain(),wet=AC.createGain();dl.delayTime.value=SP*3;fb.gain.value=.35;wet.gain.value=.3;BUS.connect(MG_);BUS.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(MG_);
NB=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
nt=AC.currentTime+.1;step=0;tmr=setInterval(sched,100);
AC.onstatechange=()=>{const h=document.getElementById('mh');if(h)h.style.display=AC&&AC.state=='running'?'none':''}}
function musicStop(){if(!mus)return;mus=false;clearInterval(tmr);const a=AC;try{MG_.gain.cancelScheduledValues(0);MG_.gain.setTargetAtTime(0,a.currentTime,.2)}catch(e){}setTimeout(()=>{try{a.close()}catch(e){}},1500);AC=null}
function vol(){if(AC&&MG_&&AC.currentTime>t0+2.6){MG_.gain.cancelScheduledValues(AC.currentTime);MG_.gain.setTargetAtTime(mut?0:(V=='welcome'?.55:.3),AC.currentTime,.6)}}
function musicTog(){if(!AC)return;if(AC.state!='running'){AC.resume();return}mut=!mut;MG_.gain.setTargetAtTime(mut?0:(V=='welcome'?.55:.3),AC.currentTime,.1);document.querySelectorAll('.mbt').forEach(b=>b.textContent=mut?'🔇':'🔊')}
